name: Sendae server
icon: public/favicon.svg
icon_initials: Sv
processes:
  Queue:
    command: php artisan queue:work --sleep=3 --tries=1 --timeout=840
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  Scheduler:
    command: php artisan schedule:work
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
  Pail:
    command: php artisan pail -vv
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  Tests:
    command: php artisan test
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Update:
    command: composer update
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
