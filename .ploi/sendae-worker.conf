# Replace the existing sendae.app worker; do not install a second worker alongside it.
[program:sendae-worker]
directory=/home/ploi/sendae.app
command=/usr/bin/php8.4 artisan queue:work database --sleep=3 --tries=1 --timeout=840 --memory=256
user=ploi
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=960
redirect_stderr=true
stdout_logfile=/home/ploi/sendae.app/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
